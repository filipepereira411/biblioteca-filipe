<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Minha Biblioteca de Livros</title>
    <style>
        :root {
            --azul-dogman: #2b59a2;
            --amarelo-fundo: #fbc02d;
            --laranja-titulo: #e65100;
            --branco: #ffffff;
            --preto: #212121;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        nav {
            background-color: var(--azul-dogman);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 4px solid var(--preto);
            border-radius: 10px;
            box-shadow: 4px 4px 0px var(--preto);
            margin-bottom: 30px;
        }

        nav h1 {
            color: var(--branco);
            margin: 0;
            font-size: 1.4rem;
        }

        .btn-logout {
            background-color: #d32f2f;
            color: white;
            border: 2px solid var(--preto);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--branco);
            border: 4px solid var(--preto);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 6px 6px 0px var(--preto);
        }

        h2 {
            color: var(--laranja-titulo);
            margin-top: 0;
        }

        .welcome-msg {
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 3px solid var(--preto);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1.1rem;
            box-sizing: border-box;
            resize: vertical;
            background-color: #fffde7;
        }

        .btn-salvar {
            background-color: #388e3c;
            color: white;
            border: 3px solid var(--preto);
            padding: 10px 25px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--preto);
            margin-top: 15px;
        }

        .btn-salvar:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--preto);
        }
    </style>
    <script>
        // SEGURANÇA: Se não houver utilizador ativo, bloqueia o acesso imediatamente
        const usuarioAtivo = localStorage.getItem("usuario_ativo");
        if (!usuarioAtivo) {
            window.location.href = "index.html";
        }
    </script>
</head>
<body>

    <nav>
        <h1>📚 Biblioteca Secreta</h1>
        <button class="btn-logout" onclick="fazerLogout()">Sair (Logout) 🚪</button>
    </nav>

    <div class="container">
        <h2 id="titulo-boas-vindas">Olá, Escritor!</h2>
        <div class="welcome-msg">O teu progresso é guardado exclusivamente na tua conta.</div>
        
        <textarea id="conteudo-livro" placeholder="Era uma vez uma nova aventura..."></textarea>
        <br>
        <button class="btn-salvar" onclick="salvarLivro()">Guardar Livro 💾</button>
    </div>

    <script>
        // Define dinamicamente o nome do utilizador logado no título
        document.getElementById("titulo-boas-vindas").textContent = `Livro Secreto de: ${usuarioAtivo} 🐾`;

        // Chave única para o livro deste utilizador (ex: livro_admin, livro_pedro)
        const chaveLivro = "livro_" + usuarioAtivo;

        // Carrega apenas o texto guardado por ESTE utilizador
        document.getElementById("conteudo-livro").value = localStorage.getItem(chaveLivro) || "";

        function salvarLivro() {
            const texto = document.getElementById("conteudo-livro").value;
            localStorage.setItem(chaveLivro, texto);
            alert("Boa! O teu livro foi guardado com sucesso! 📝");
        }

        function fazerLogout() {
            // Elimina apenas o utilizador ativo da sessão
            localStorage.removeItem("usuario_ativo");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
